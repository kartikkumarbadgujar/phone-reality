# Streamlit settings for BudgetBench (used locally and on Community Cloud)
[server]
# headless = true: Streamlit prints the address instead of asking for an e-mail on first run.
# Open http://localhost:8501 in your browser (Ctrl+click the link in the terminal).
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
primaryColor = "#8b5cf6"
